# SwinUNETR 5-fold CV on AMOS (fine-tune from BTCV-pretrained bundle by default).
dataset: amos
pretrained: true                 # true = fine-tune BTCV SwinUNETR; false = train from scratch
pretrained_ckpt: ${DATA_ROOT}/benchmark_seg/bundles/swin_unetr_btcv_segmentation/models/model.pt
patch: 96                        # SwinUNETR window size (train + val)
val_patch: 96
batch_size: 2
learning_rate: 1.0e-4
weight_decay: 1.0e-5
epochs: 100
val_interval: 10
num_workers: 8
seed: 0
output_dir: ${WEIGHTS_ROOT}/swinunetr_runs/amos
