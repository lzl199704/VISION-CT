# Merlin (Stanford abd-CT) foundation encoder -> downstream LUNG1 5-yr survival.
# RUN WITH: python  # (Merlin environment)
encoder_source: merlin

task: multiclass
label_col: label
num_classes: 4           # adeno / squamous / large-cell / NOS
pid_col: PatientID
nifti_template: "${BENCHMARKS_ROOT}/NSCLC-Radiomics/image/{pid}/{pid}.nii.gz"          # raw LUNG1 nifti; Merlin preprocessing done at load (LAS->RAS)

train_csv: ${BENCHMARKS_ROOT}/NSCLC-Radiomics/nsclc_histology_train_preprocessed.csv
val_csv:   ${BENCHMARKS_ROOT}/NSCLC-Radiomics/nsclc_histology_val_preprocessed.csv
test_csv:  ${BENCHMARKS_ROOT}/NSCLC-Radiomics/nsclc_histology_test_preprocessed.csv

freeze_encoder: false           # FULL FINE-TUNE (encoder + head) is the default
learning_rate: 1.0e-4           # head LR (full fine-tune)
encoder_lr_mult: 0.1            # encoder LR = learning_rate * this (discriminative)
weight_decay: 0.01
dropout: 0.1
batch_size: 4                   # volumes/batch during feature extraction
head_batch_size: 64
epochs: 50
num_workers: 8
seed: 0
output_dir: ${WEIGHTS_ROOT}/fe_runs/lung1_histology_merlin
