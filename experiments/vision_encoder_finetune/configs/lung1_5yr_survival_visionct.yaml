# LUNG1 / NSCLC-Radiomics — 5-year overall-survival (binary). Data prep already done
# (intern handoff): raw-HU npz, split CSVs with img_file_path,label. See README §6.
encoder_source: visionct
visionct_ckpt: ${WEIGHTS_ROOT}/Step1_chest_ermi_sinai_0504_NO_AUG_updatedQA/checkpoint-75000/model.safetensors
model_name: tf_efficientnetv2_b0.in1k

task: binary
label_col: label
img_col: img_file_path

train_csv: ${BENCHMARKS_ROOT}/NSCLC-Radiomics/lung1_5yr_survival_train.csv
val_csv:   ${BENCHMARKS_ROOT}/NSCLC-Radiomics/lung1_5yr_survival_val.csv
test_csv:  ${BENCHMARKS_ROOT}/NSCLC-Radiomics/lung1_5yr_survival_test.csv

# npz_5yr_survival is RAW HU (int16) -> window here (lung window). Keep identical across encoders.
prewindowed: false
window_center: -600
window_width: 1500
input_size: 256

# class imbalance ~18.5% positive -> upweight positives (n_neg/n_pos ≈ 3.4). Tune with the grid.
pos_weight: 3.4

freeze_encoder: false
learning_rate: 1.0e-4
encoder_lr_mult: 0.1
weight_decay: 0.01
dropout: 0.1
batch_size: 4
epochs: 40
num_workers: 8
seed: 0
output_dir: ${WEIGHTS_ROOT}/vf_runs/lung1_5yr_survival_visionct
