# ---- encoder ----
encoder_source: imagenet          # 'visionct' (chest VISION-CT weights) or 'imagenet'
visionct_ckpt: ${WEIGHTS_ROOT}/Step1_chest_ermi_sinai_0504_NO_AUG_updatedQA/checkpoint-75000/model.safetensors
model_name: tf_efficientnetv2_b0.in1k   # must match the VISION-CT backbone

# ---- task (EDIT for your CSV: binary | multiclass | multilabel) ----
task: binary
label_col: label                  # binary/multiclass: one column
# num_classes: 5                  # multiclass only
# label_cols: [effusion, nodule, emphysema]   # multilabel only (one 0/1 column each)
img_col: img_file_path

# ---- data (intern fills these; CT volume .npz paths) ----
train_csv: /PATH/TO/train.csv
val_csv:   /PATH/TO/val.csv
test_csv:  /PATH/TO/test.csv
window_center: -600               # HU window (chest/lung); soft-tissue: 40 / 400
window_width: 1500
input_size: 256                   # 3D cube fed to the encoder (matches pre-training)

# ---- hyperparameters (tune these; keep IDENTICAL across encoder_source for a fair comparison) ----
freeze_encoder: false             # true = linear probe (head only)
learning_rate: 1.0e-4             # head LR
encoder_lr_mult: 0.1              # encoder LR = learning_rate * this (discriminative LR)
weight_decay: 0.01
dropout: 0.1
batch_size: 4
epochs: 30
num_workers: 8
seed: 0
output_dir: ${WEIGHTS_ROOT}/vf_runs/imagenet_binary
