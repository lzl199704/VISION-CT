# ============================================================================
# COMBINED chest + abdomen (contrast + non-contrast)  —  STEP 2: classification + segmentation
# Derived from abd_step2_contrast_config.yaml (the paper's main abdomen Step-2 recipe).
# Data : data_splits/combined/Sinai_ERMI_chest_abd_train_val_step2_0903.parquet
#        PLAIN MERGE of the three existing train/val splits (same split as before; nothing dropped):
#        train 925,655 rows / val 43,651 rows over 39 findings (20 chest + 17 abd-contrast +
#        2 abd-non-contrast stone findings), all ~50/50 pos:neg. Liver fatty infiltration is EXCLUDED from
#        train/val (non-contrast only, while Merlin tests it on contrast); its test rows remain but are
#        not a trained-model result. Includes STEP2_EXTRA: the 20,460 CONTRAST-phase gallstone /
#        renal-calculus rows from the published mixncstone set, so the two stone findings are trained on
#        both phases -- the Merlin public test asks them on 5,109 contrast volumes. Eval runs once per checkpoint (eval_steps = save_steps = 12,500) because a
#        full-val pass is 44k volumes; lower eval_steps if you want finer val-loss curves.
# Init : Step-1 vision encoder + decoder from Step1_Pretrain_Seg_0903_chest_abd (checkpoint-15000).
# Budget: the two specialist runs used 50k (abd) + 75k (chest) steps at effective batch 32.
#        125k steps = the SAME total compute as training both specialists -> fair comparison of one
#        combined model vs two specialists. Per-finding exposure at 125k steps: chest ~146k samples/finding
#        (specialist: 125k), abdomen ~65k (specialist: 99k). Raise max_steps or oversample abdomen rows if
#        abdomen findings need to match the specialist exposure.
# Launch (DDP on ALL 8 GPUs; per-device 4 x 8 GPUs x grad_accum 1 = effective batch 32, identical to
#        every published run, so max_steps stays 125,000):
#   docker run -d --name uniferum_step2_0903 --gpus all --shm-size 64g --ipc=host --ulimit memlock=-1 \
#     --entrypoint torchrun -e NCCL_P2P_DISABLE=1 -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e HF_HOME=/hf \
#     -e OMP_NUM_THREADS=8 -v /raid:/raid -v $PWD:$PWD -v $HOME/.cache/huggingface:/hf -w $PWD \
#     uniferum_train:latest --nproc_per_node 8 bin/train_semantic_seg_two_stage.py \
#     --config_file configs/chest_abd_step2_finetune_config.yaml
# GPU note: NCCL_P2P_DISABLE=1 is REQUIRED for 8-GPU runs on this host. Two NVLink P2P links are faulty,
#        (4,5) and (6,7); NCCL aborts with "unhandled cuda error" on any GPU set containing both members
#        of a broken pair unless peer-to-peer is turned off. With P2P off the gradient all-reduce routes
#        through host memory, which is affordable for DDP (gradients only) but crippling for the HF
#        Trainer's default DataParallel (full model broadcast every step) -- always launch with torchrun.
#        Working alternatives with P2P ON: GPUs 0-3 (grad_accum 2), or 0,1,2,3,4,6 / 0,1,2,3,5,7.
# Speed : measured over 150 steps -- 8 GPUs 33.4 samples/s, 4 GPUs 31.7, 6 GPUs 30.5. The pipeline is
#        I/O bound on loading 256^3 npz volumes, not GPU bound, so extra GPUs buy little: 125,000 steps
#        takes ~31 h on 8 GPUs vs ~35 h on 4.
# STABILITY (rev 2, after the first 0903 run diverged):
#   The first run was clean to step 25,000 (eval 0.6380) then gradients went infinite at 27,500 and
#   78% of all later steps were non-finite; eval ended at 0.9408 and Dice collapsed 0.93 -> 0.64.
#   Train loss rose alongside eval, so this was numerical damage, not overfitting (train and eval were
#   within 0.006 of each other at step 25,000, i.e. still underfitted).
#   Three changes:
#   1. learning_rate 1e-4 -> 5e-5. Chest is 69% of these rows and the chest specialist trained at 5e-5;
#      we had inherited the abdomen 1e-4. The old schedule also held LR >= 9e-5 for 23,555 steps
#      (published abd Step 2: 9,422) and the blow-up landed inside that window.
#   2. warmup_steps 10000 -> 8000, matching the chest specialist.
#   3. loss_fct_seg_kwargs.smooth 1e-4 -> 1.0. ~5.8% of rows (77.5% of prostate rows) have an empty
#      organ mask; a 1e-4 denominator makes the Dice gradient explode on them.
#   4. skip_nonfinite_grad_steps: skip the optimizer step entirely when any rank sees a non-finite
#      gradient. Zeroing the gradient is not enough -- AdamW still applies weight decay and advances
#      its moments, so tens of thousands of "zeroed" steps shrink the weights.
# ============================================================================
bce_weight: 0.2
cls_loss_weight: 1.0
dice_weight: 0.8
freeze_llm: true
hf_TrainingArguments:
  bf16: true
  dataloader_num_workers: 16
  ddp_find_unused_parameters: true
  eval_steps: 12500
  evaluation_strategy: steps
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-05
  logging_dir: ${WEIGHTS_ROOT}/Step2_Finetune_Multimodal_0907_chest_abd/logs
  logging_steps: 500
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  max_steps: 125000
  output_dir: ${WEIGHTS_ROOT}/Step2_Finetune_Multimodal_0907_chest_abd/
  per_device_eval_batch_size: 1
  per_device_train_batch_size: 4
  remove_unused_columns: false
  save_steps: 12500
  warmup_steps: 8000
  weight_decay: 0.015
input_file: ${DATA_ROOT}/splits/combined/Sinai_ERMI_chest_abd_train_val_step2_0903.parquet
llm_args:
  bert_encoder_layers: 4
  model_class: BertModel
  model_id: Simonlee711/Clinical_ModernBERT
loss_combination_strategy: weighted_sum
loss_fct_seg: CombinedBCEDiceLoss
loss_fct_seg_kwargs:
  smooth: 1.0
mixer_args:
  d_model: 768
  name: latent_mem
  nhead: 8
  num_layers: 1
  vision_as_mem: false
predict_transform:
- name: Resize
  spatial_size:
  - 256
  - 256
  - 256
pretrain_checkpoint: ${WEIGHTS_ROOT}/Step1_Pretrain_Seg_0903_chest_abd/checkpoint-15000/model.safetensors
seg_loss_weight: 1.0
skip_nonfinite_grad_steps: true
train_transform:
- name: RandFlip
  prob: 0.5
  spatial_axis: 0
- name: RandRotate90
  prob: 0.5
- name: Resize
  spatial_size:
  - 256
  - 256
  - 256
train_transform_imgonly:
- factors: 0.1
  name: RandScaleIntensity
  prob: 0.3
- name: RandShiftIntensity
  offsets: 0.1
  prob: 0.3
training_stage: finetune
use_3d_decoder: true
use_skip_connection: true
vision_args:
  feature_dim: 192
  llm_emb_dim: 768
  model_args:
    features_only: true
    global_pool: ''
    in_chans: 1
    model_name: tf_efficientnetv2_b0.in1k
    num_classes: 0
    pretrained: true
  model_class: EfficientNetViT
  nhead: 8
  seqlen: 514
