# ============================================================================
# COMBINED chest + abdomen (contrast + non-contrast)  —  STEP 1: segmentation pretrain
# Derived from abd_step1_pretrain_seg_config.yaml (Step1_Pretrain_Seg_0328_abd) and following the
# established chest recipe in ${DATA_ROOT}/make_chest_step1_step2.py:
# question = "Segment: {organ}", every organ balanced to the SAME number of rows.
# Data : data_splits/combined/Sinai_ERMI_chest_abd_train_val_step1_seg_0903.parquet
#        train 144,871 rows / 1,500 val, 15 organs, 10,000 rows per organ (regions are NOT balanced
#        against each other -- the organ is the unit of balance):
#          chest   (4)  lung [10,11,12,13,14 = the 5 TotalSegmentator lobes], heart [51],
#                       thoracic aorta [52], chest [47-label catch-all region for pathologies that
#                       cannot be localised to lung/heart/aorta]
#          abdomen (11) liver, spleen, pancreas, kidney, gallbladder, stomach, bowel, abdominal aorta,
#                       prostate, lymph node area, abdomen
#        14 of 15 organs hit 10,000 exactly; prostate reaches 4,871 -- only ~7.5% of abdomen volumes
#        contain a prostate above the 1,000-voxel presence threshold, and all 65,006 were scanned.
#        Rows are emitted only where the organ really exists (>=1,000 voxels) and chest volumes only
#        where the lung mask is >=300k voxels, so no target is empty. Label ids come from
#        data_utils/anatomical_map.py. See data_splits/combined/MANIFEST.md.
# Budget: published abdomen Step 1 = 10k steps x 32 = 320k samples over 110k rows (2.9 epochs).
#        15k steps x 32 = 480k samples over 144.9k rows = 3.3 epochs, a small increase for a task that
#        now spans 15 organs across two body regions.
# Launch (DDP on GPUs 0-3 -- see the GPU note below; per-device 4 x 4 GPUs x grad_accum 2 = effective
#        batch 32, identical to every published run):
#   docker run --rm --gpus '"device=0,1,2,3"' --shm-size 64g --ipc=host --ulimit memlock=-1 \
#     --entrypoint torchrun -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e HF_HOME=/hf -e OMP_NUM_THREADS=8 \
#     -v /raid:/raid -v $PWD:$PWD -v $HOME/.cache/huggingface:/hf -w $PWD visionct_train:latest \
#     --nproc_per_node 4 bin/train_semantic_seg_two_stage.py --config_file configs/chest_abd_step1_pretrain_seg_config.yaml
# GPU note: this host has TWO broken NVLink P2P pairs, (4,5) and (6,7). NCCL fails with "unhandled cuda
#        error" on any GPU set containing both members of either pair, so 8-GPU runs are impossible until
#        the hardware is fixed. GPUs 0-3 are a clean full-NVLink group. 6-GPU sets that work: 0,1,2,3,4,6
#        or 0,1,2,3,5,7 (adjust gradient_accumulation_steps to keep the effective batch at 32).
# Speed : measured 18.6 samples/s = 0.58 optimizer steps/s over 150 steps -> 15,000 steps ~= 7 h.
# ============================================================================
bce_weight: 0.2
cls_loss_weight: 0.0
dice_weight: 0.8
hf_TrainingArguments:
  bf16: true
  dataloader_num_workers: 16
  ddp_find_unused_parameters: true
  eval_steps: 1500
  evaluation_strategy: steps
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  logging_dir: ${WEIGHTS_ROOT}/Step1_Pretrain_Seg_0903_chest_abd/logs
  logging_steps: 500
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  max_steps: 15000
  output_dir: ${WEIGHTS_ROOT}/Step1_Pretrain_Seg_0903_chest_abd/
  per_device_eval_batch_size: 1
  per_device_train_batch_size: 4
  remove_unused_columns: false
  save_steps: 3000
  warmup_steps: 1500
  weight_decay: 0.01
input_file: ${DATA_ROOT}/splits/combined/Sinai_ERMI_chest_abd_train_val_step1_seg_0903.parquet
llm_args:
  bert_encoder_layers: 4
  model_class: BertModel
  model_id: Simonlee711/Clinical_ModernBERT
loss_combination_strategy: weighted_sum
loss_fct_seg: CombinedBCEDiceLoss
mixer_args:
  d_model: 768
  name: latent_mem
  nhead: 8
  num_layers: 1
  vision_as_mem: false
predict_transform:
- name: Resize
  spatial_size:
  - 256
  - 256
  - 256
seg_loss_weight: 1.0
train_transform:
- name: Resize
  spatial_size:
  - 256
  - 256
  - 256
training_stage: pretrain
use_3d_decoder: true
use_skip_connection: true
vision_args:
  feature_dim: 192
  llm_emb_dim: 768
  model_args:
    features_only: true
    global_pool: ''
    in_chans: 1
    model_name: tf_efficientnetv2_b0.in1k
    num_classes: 0
    pretrained: true
  model_class: EfficientNetViT
  nhead: 8
  seqlen: 514
